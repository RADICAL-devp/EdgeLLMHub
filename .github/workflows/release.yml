name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backend:
    name: Backend server binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/apps/clinical-intelligence-dart
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Install dart_frog_cli
        run: dart pub global activate dart_frog_cli

      - name: Build server
        run: dart_frog build

      - name: Compile & package binary
        run: |
          mkdir -p ../../../dist
          dart compile exe build/bin/server.dart -o build/bin/server
          tar -czf ../../../dist/clinical-intelligence-dart-linux-x64.tar.gz -C build .

      - name: Verify artifact checksum
        run: |
          cd ../../../dist
          sha256sum clinical-intelligence-dart-linux-x64.tar.gz
          sha256sum clinical-intelligence-dart-linux-x64.tar.gz > clinical-intelligence-dart-linux-x64.tar.gz.sha256
          sha256sum -c clinical-intelligence-dart-linux-x64.tar.gz.sha256

      - name: GPG-sign the release artifact
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$RELEASE_GPG_PRIVATE_KEY" ]; then
            echo "No RELEASE_GPG_PRIVATE_KEY secret configured — skipping signature."
            exit 0
          fi
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          cd ../../../dist
          echo "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign clinical-intelligence-dart-linux-x64.tar.gz

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/clinical-intelligence-dart-linux-x64.tar.gz
            dist/clinical-intelligence-dart-linux-x64.tar.gz.sha256

      - name: Attach GPG signature to release
        if: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clinical-intelligence-dart-linux-x64.tar.gz.asc

  android:
    name: Android AppBundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/apps/doctor_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Install dependencies
        run: flutter pub get

      - name: Build appbundle
        run: flutter build appbundle --release

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS App (no codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: projects/apps/doctor_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .app
        run: |
          mkdir -p ../../../dist
          zip -rq ../../../dist/doctor-app-ios.zip build/ios/iphoneos/Runner.app

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/doctor-app-ios.zip