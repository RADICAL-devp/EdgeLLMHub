version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /packages/shared_models
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /projects/apps/doctor_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: /projects/apps/clinical-intelligence-dart
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
