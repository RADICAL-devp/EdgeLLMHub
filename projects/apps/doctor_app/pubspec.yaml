name: doctor_app
description: "Private, on-device clinical documentation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI / state / navigation
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  go_router: ^15.1.2
  get_it: ^9.2.1
  equatable: ^2.1.0
  intl: ^0.20.2

  # Local storage (encrypted at the field level with PhiEncryptionService)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.42
  sqlite3: ^3.4.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.0
  crypto: ^3.0.3
  convert: ^3.1.2
  encrypt: ^5.0.3

  # On-device AI: LLM + speech-to-text. All processing stays on the device.
  flutter_edge_ai: ^2.5.4
  flutter_edge_ai_litertlm: ^1.19.0
  flutter_edge_ai_speech: ^0.5.12
  record: ^7.1.2

  # Platform helpers
  connectivity_plus: ^7.3.2
  permission_handler: ^13.0.2
  uuid: ^4.5.3

  # Parked future integration (Agora) uses Dio; it is not wired into the app.
  dio: ^5.10.0

  shared_models:
    path: ../../packages/shared_models

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
