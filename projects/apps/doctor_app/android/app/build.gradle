plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.omoyari.greentech.doctor_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.omoyari.greentech.doctor_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // flutter_gemma litertlm (libLiteRtLm.so) requires API 30+ Bionic
        // syscalls — below 30 the engine can't load and inference falls back
        // to the labeled stub tier. Revert to flutter.minSdkVersion only if
        // pre-Android-11 devices must install the app (LLM becomes stub-only).
        minSdk = 30
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // flutter_gemma litertlm ships arm64-v8a only; without this filter
        // the Play Store offers broken native libs to x86/armeabi devices.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // DORMANT (flutter_gemma migration): MLC LLM Android runtime is no longer
    // the inference engine. Kept as a comment for rollback; flutter_gemma
    // ships its own native runtime via pub. Re-enable only with MLCLLMHandler.
    // implementation("org.mlc:llm-android:0.20.0")
}
