openapi: 3.1.0
info:
  title: Clinical Intelligence Backend
  description: Clinical text processing (voice-notes workflow) and transcript summarization APIs. All endpoints except /api/v1/auth/token require a Bearer JWT (see auth/token).
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
    description: Token minting (dev only)
  - name: Clinical Processing
    description: Voice-notes workflow
  - name: Transcript Summary
    description: AI summarization API
  - name: Notes
    description: Doctor note sync
paths:
  /api/v1/auth/token:
    post:
      tags:
        - Auth
      operationId: authToken
      summary: Mint a development JWT (disabled when DISABLE_DEV_AUTH=true)
      security: []
      responses:
        200:
          description: Signed access token
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/TokenResponse'
        404:
          description: Dev auth disabled
  /api/v1/clinical-processing/process:
    post:
      tags:
        - Clinical Processing
      operationId: clinicalProcess
      summary: Process clinical text in a given mode (VOCAB_ASSIST, CLEAN_TRANSCRIPT, SUMMARIZE, GENERATE_DOCTOR_NOTE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/ClinicalProcessingRequest'
      responses:
        200:
          description: Processed text
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/ClinicalProcessingResponse'
        400:
          description: Validation failure
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
        401:
          description: Missing or invalid token
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/transcript-summary/structured:
    post:
      tags:
        - Transcript Summary
      operationId: structuredSummary
      summary: Generate a 7-field structured clinical summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/StructuredSummaryRequest'
      responses:
        200:
          description: Structured summary
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/StructuredSummary'
        400:
          description: Validation failure
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/transcript-summary/context-enriched:
    post:
      tags:
        - Transcript Summary
      operationId: contextEnrichedSummary
      summary: Generate a structured summary using past consultation context; when pastContext is omitted it is retrieved from the vector store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/ContextEnrichedRequest'
      responses:
        200:
          description: Structured summary
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/StructuredSummary'
        400:
          description: Validation failure
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/transcript-summary/executive:
    post:
      tags:
        - Transcript Summary
      operationId: executiveSummary
      summary: Generate an executive summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/TranscriptTextRequest'
      responses:
        200:
          description: Executive summary
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/TextResponse'
        400:
          description: Validation failure
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/transcript-summary/doctor-note:
    post:
      tags:
        - Transcript Summary
      operationId: doctorNote
      summary: Generate a doctor note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/DoctorNoteRequest'
      responses:
        200:
          description: Doctor note text
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/TextResponse'
        400:
          description: Validation failure
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/transcript-summary/generate:
    post:
      tags:
        - Transcript Summary
      operationId: generateSummaryBundle
      summary: Generate a full summary bundle (structured summary, doctor note) and seed the vector store with the consultation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/SummaryBundleRequest'
      responses:
        200:
          description: Generated summary bundle
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/TranscriptSummaryResponse'
        400:
          description: Validation failure
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/transcript-summary/{consultationId}:
    get:
      tags:
        - Transcript Summary
      operationId: getSummaryBundle
      summary: Fetch a generated summary bundle
      parameters:
        - name: consultationId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Summary bundle
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/TranscriptSummaryResponse'
        404:
          description: No summary for consultation
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Transcript Summary
      operationId: regenerateSummary
      summary: Regenerate the summary for an existing transcript
      parameters:
        - name: consultationId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Regenerated summary bundle
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/TranscriptSummaryResponse'
        404:
          description: No transcript for consultation
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/notes/sync:
    post:
      tags:
        - Notes
      operationId: syncNote
      summary: Upsert a doctor note (last-write-wins)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              '$ref': '#/components/schemas/NotesSyncRequest'
      responses:
        200:
          description: Sync acknowledgement
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/SyncResponse'
        400:
          description: Validation failure
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /api/v1/notes/consultation/{consultationId}:
    get:
      tags:
        - Notes
      operationId: getNote
      summary: Fetch the most recent synced note for a consultation
      parameters:
        - name: consultationId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Doctor note
          content:
            required: true
            content:
              application/json:
                schema:
                  '$ref': '#/components/schemas/DoctorNoteModel'
        404:
          description: No note for consultation
          content:
            application/json:
              schema:
                '$ref': '#/components/schemas/ErrorResponse'
  /:
    get:
      tags:
        - System
      operationId: health
      summary: Service health check
      responses:
        200:
          description: Service is up
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ClinicalProcessingRequest:
      type: object
      additionalProperties: false
      required:
        - inputText
        - processingMode
      properties:
        inputText:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 10000000
          description: Raw clinical text to process.
        processingMode:
          type: string
          enum:
            - VOCAB_ASSIST
            - CLEAN_TRANSCRIPT
            - SUMMARIZE
            - GENERATE_DOCTOR_NOTE
            - FULL_BUNDLE
        consultationId:
          type: string
        patientId:
          type: string
        doctorId:
          type: string
        consultationMode:
          type: string
          enum:
            - IN_PERSON
            - ONLINE
        source:
          type: string
    StructuredSummaryRequest:
      type: object
      additionalProperties: false
      required:
        - transcriptText
      properties:
        transcriptText:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 10000000
    ContextEnrichedRequest:
      type: object
      additionalProperties: false
      required:
        - transcriptText
      properties:
        transcriptText:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 10000000
        pastContext:
          type: string
          maxLength: 10000000
          description: Optional. When omitted, similar past consultations are retrieved automatically from the vector store.
    DoctorNoteRequest:
      type: object
      additionalProperties: false
      required:
        - transcriptText
      properties:
        transcriptText:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 10000000
        consultationId:
          type: string
        patientId:
          type: string
        doctorId:
          type: string
    TranscriptTextRequest:
      type: object
      additionalProperties: false
      required:
        - transcriptText
      properties:
        transcriptText:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 10000000
    NotesSyncRequest:
      type: object
      additionalProperties: false
      required:
        - noteId
        - consultationId
        - createdAt
        - updatedAt
      properties:
        noteId:
          type: string
          minLength: 1
        consultationId:
          type: string
          minLength: 1
        patientId:
          type: string
        doctorId:
          type: string
        rawText:
          type: string
        richTextDelta:
          type: string
        status:
          type: string
        patientRecap:
          type: string
        extractedFields:
          type: object
          properties:
            symptoms:
              type: array
              items:
                type: string
            duration:
              type: string
            medications:
              type: array
              items:
                type: string
            allergies:
              type: array
              items:
                type: string
            testsRecommended:
              type: array
              items:
                type: string
            followUpActions:
              type: array
              items:
                type: string
            provisionalDiagnosis:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SummaryBundleRequest:
      type: object
      required:
        - consultationId
        - patientId
        - doctorId
        - transcriptText
      properties:
        consultationId:
          type: string
          minLength: 1
        patientId:
          type: string
          minLength: 1
        doctorId:
          type: string
          minLength: 1
        sleepLabId:
          type: string
        transcriptText:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 10000000
        consultationMode:
          type: string
          enum:
            - IN_PERSON
            - ONLINE
    TokenResponse:
      type: object
      properties:
        token:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresAt:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
    ClinicalProcessingResponse:
      type: object
      properties:
        processedText:
          type: string
        processingMode:
          type: string
        warnings:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time
        metadata:
          type: object
    StructuredSummary:
      type: object
      properties:
        complaint:
          type:
            - string
            - 'null'
        pastHistory:
          type:
            - string
            - 'null'
        vitals:
          type:
            - string
            - 'null'
        physicalExamination:
          type:
            - string
            - 'null'
        investigationOrdered:
          type:
            - string
            - 'null'
        diagnosis:
          type:
            - string
            - 'null'
        advice:
          type:
            - string
            - 'null'
    TextResponse:
      type: object
      properties:
        note:
          type: string
        summary:
          type: string
    SyncResponse:
      type: object
      properties:
        synced:
          type: boolean
        noteId:
          type: string
    DoctorNoteModel:
      type: object
      properties:
        noteId:
          type: string
        consultationId:
          type: string
        patientId:
          type: string
        doctorId:
          type: string
        rawText:
          type: string
        richTextDelta:
          type:
            - string
            - 'null'
        status:
          type: string
        patientRecap:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TranscriptSummaryResponse:
      type: object
      properties:
        consultationId:
          type: string
        transcriptId:
          type: string
        executiveSummary:
          '$ref': '#/components/schemas/StructuredSummary'
        structuredMedicalSummary:
          '$ref': '#/components/schemas/StructuredSummary'
        doctorNote:
          '$ref': '#/components/schemas/DoctorNoteModel'
        generatedAt:
          type: string
          format: date-time
        consultationMode:
          type:
            - string
            - 'null'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        errors:
          type:
            - array
            - 'null'
          items:
            type: string
security:
  - bearerAuth: null
