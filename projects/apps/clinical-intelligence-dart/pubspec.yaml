name: clinical_intelligence_dart
description: >
  Dart Frog Clinical Intelligence backend.
  Provides clinical text processing (voice-notes workflow) and
  transcript summarization APIs.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  dart_frog: ^1.2.6
  uuid: ^4.5.1
  http: ^1.2.2
  meta: ^1.15.0
  drift: ^2.18.0
  sqlite3: ^2.4.0
  path: ^1.9.0
  shared_models:
    path: ../../packages/shared_models
  jose: ^0.3.5+2
  pointycastle: ^3.7.3
  args: ^2.5.0
  json_schema: ^5.2.2

dev_dependencies:
  test: ^1.25.8
  mocktail: ^1.0.4
  very_good_analysis: ^6.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.15.1
